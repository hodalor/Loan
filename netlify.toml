[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/privacy/"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/tandc"
  to = "/tandc/index.html"
  status = 200

[[redirects]]
  from = "/tandc/"
  to = "/tandc/index.html"
  status = 200

[[redirects]]
  from = "/delete-account"
  to = "/delete-account/index.html"
  status = 200

[[redirects]]
  from = "/delete-account/"
  to = "/delete-account/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
